name: UI screenshots and browser smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render desktop and mobile previews
        env:
          DATA_DIR: /tmp/zabbix-ai-ui-data
          APP_ENCRYPTION_KEY: 'placeholder-ui-test-key'
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8088 > /tmp/ui-server.log 2>&1 &
          python .github/scripts/ui_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
