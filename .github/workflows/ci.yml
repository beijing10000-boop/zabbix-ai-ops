name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.58.1
      - run: npx playwright install --with-deps chromium
      - run: |
          DATA_DIR=$RUNNER_TEMP/zabbix-ui APP_ENCRYPTION_KEY='test-ci-only-not-production' python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 > /tmp/zabbix-ui.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8099/healthz && break || sleep 1; done
          node tests/ui_visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/ui/*.png
