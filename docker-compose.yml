services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    restart: unless-stopped
    volumes: [redisdata:/data]
  web:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8088"]
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set key}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set admin token}
    volumes: [appdata:/app/data]
    depends_on: [redis]
  worker:
    build: .
    command: ["python","-m","app.worker"]
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set key}
    volumes: [appdata:/app/data]
    depends_on: [redis]
volumes:
  appdata:
  redisdata:
