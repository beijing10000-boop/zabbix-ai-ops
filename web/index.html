<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F2F2F7">
<title>Zabbix AI Ops · 智能运维控制台</title>
<link rel="stylesheet" href="/assets/app.css">
<script defer src="/assets/app.js"></script>
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-card">
    <span class="login-mark" aria-hidden="true">Z</span>
    <h1>Zabbix AI Ops</h1>
    <p>智能监控与运维协作</p>
    <a class="btn btn-primary btn-login" href="/api/v1/auth/login">使用飞书登录</a>
    <p class="login-error" id="login-error" role="status"></p>
  </div>
</div>
<div id="app" class="app-shell" hidden>
  <aside class="sidebar" aria-label="主导航">
    <div class="brand"><span class="brand-icon">Z</span><span><strong>Zabbix AI Ops</strong><small>Operations Center</small></span></div>
    <nav id="sidebar-nav" class="nav"></nav>
    <div class="sidebar-footer"><span id="app-version">检查版本中…</span></div>
  </aside>
  <div class="workspace">
    <header id="compact-header" class="compact-header"><strong id="compact-title"></strong><div class="account"><span class="status-dot dot-green"></span><span id="username">管理员</span><button id="logout" class="btn btn-text">退出</button></div></header>
    <main id="main" class="main" tabindex="-1">
      <div class="page-heading"><h1 id="large-title">总览</h1><p id="page-description"></p></div>
      <div id="page-content"></div>
    </main>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动端导航"></nav>
  </div>
</div>
<div id="overlay" class="overlay" hidden>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-heading"><h2 id="sheet-title"></h2></header>
    <div id="sheet-content" class="sheet-content"></div>
    <footer id="sheet-actions" class="sheet-actions"></footer>
  </section>
</div>
<div id="drawer-overlay" class="drawer-overlay" hidden>
  <aside id="drawer" class="drawer" aria-labelledby="drawer-title" role="dialog" aria-modal="true">
    <header class="drawer-header"><h2 id="drawer-title"></h2><button id="drawer-close" class="btn btn-text">完成</button></header>
    <div id="drawer-body"></div>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
