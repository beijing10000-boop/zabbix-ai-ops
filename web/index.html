<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Zabbix AI Ops · 运维控制台</title>
<link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head>
<body>
<section id="login"><div class="login-card">
 <div class="logo" aria-hidden="true">Z</div><h1>Zabbix AI Ops</h1>
 <p class="sub login-subtitle">轻盈、高效的智能运维控制台</p>
 <a class="primary login-button" href="/api/v1/auth/login">使用飞书登录</a>
 <p id="login-error" class="note login-error" role="status"></p>
</div></section>
<div id="app" class="app-shell" hidden>
  <aside class="side" aria-label="主导航">
    <div class="brand"><div class="mark">Z</div><div><strong>Zabbix AI Ops</strong><span>INTELLIGENT OPERATIONS</span></div></div>
    <nav id="side-nav" class="nav" aria-label="功能导航"></nav>
    <div class="side-foot">Zabbix AI Ops · Production<div id="app-version">版本检查中</div></div>
  </aside>
  <div class="workspace">
    <header class="top"><div class="top-title"><div class="sub">监控 / 智能运维</div><h1 id="pagetitle">总览仪表盘</h1></div>
      <div class="user"><span class="pill"><i class="status-dot good"></i>已安全登录</span><div class="avatar" id="avatar">A</div><span id="username">管理员</span><button id="logout" class="secondary" type="button">退出</button></div>
    </header>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<nav id="bottom-nav" aria-label="移动导航" hidden></nav>
</body></html>
