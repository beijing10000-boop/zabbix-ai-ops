<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zabbix AI Ops</title><style>body{margin:0;background:#f5f7fb;color:#172133;font:15px system-ui,Arial}header{background:#183355;color:white;padding:20px 5%}main{max-width:1050px;margin:25px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 2px 12px #142e5111;margin-bottom:20px}label{display:block;font-weight:600;margin:16px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cad3e0;border-radius:8px;font:inherit}button{background:#2563eb;border:0;border-radius:8px;color:white;padding:11px 20px;cursor:pointer;margin:16px 10px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.hint{color:#64748b;font-size:13px}.error{color:#b91c1c}.ok{color:#147d4b}</style></head><body>
<header><h2>Zabbix AI Ops</h2><div>AI 告警分析 · MCP 只读诊断 · 飞书通知</div></header>
<main><div class="panel"><h3>管理员验证</h3><p class="hint">当前版本使用初始化管理 Token；生产版将替换为完整登录与 RBAC。Token 仅保存在当前页面内存。</p>
<input id="token" type="password" placeholder="ADMIN_API_TOKEN"><button onclick="load()">连接后台</button><span id="status"></span></div>
<div class="panel"><h3>Web 配置</h3><div id="fields" class="grid"></div><button onclick="save()">保存修改</button><span id="saved"></span>
<p class="hint">机密信息只显示 ********；留空将清空该项。不要在公共网络直接开放此管理页面；通过 HTTPS 反向代理访问。</p></div>
<div class="panel"><h3>操作审计</h3><pre id="audit" style="white-space:pre-wrap;max-height:220px;overflow:auto"></pre></div></main>
<script>
const names={openai_base_url:'AI API Base URL',openai_model:'AI 模型',openai_api_key:'AI API Key',mcp_url:'Zabbix MCP URL',mcp_token:'MCP Token',lark_app_id:'飞书 App ID',lark_app_secret:'飞书 App Secret',allowed_chat_ids:'允许问答的群 ID',feishu_webhook_url:'告警飞书 Webhook URL',feishu_sign_secret:'飞书 Webhook 签名密钥',feishu_enabled:'告警飞书发送开关 true/false',zabbix_webhook_secret:'Zabbix Webhook 密钥',min_severity:'最低告警级别 0–5',ai_prompt:'AI 提示词'};
const sensitive=new Set(['openai_api_key','mcp_token','lark_app_secret','feishu_webhook_url','feishu_sign_secret','zabbix_webhook_secret']);
let loaded={};const head=()=>({'Authorization':'Bearer '+document.getElementById('token').value,'Content-Type':'application/json'});
async function request(path,opts={}){const r=await fetch(path,{...opts,headers:head()});const j=await r.json();if(!r.ok)throw Error(j.detail||r.status);return j}
async function load(){try{loaded=await request('/api/v1/settings');document.getElementById('fields').replaceChildren(...Object.entries(names).map(([key,label])=>{let d=document.createElement('div'),l=document.createElement('label'),i=document.createElement(key==='ai_prompt'?'textarea':'input');l.textContent=label;i.id='field-'+key;i.value=loaded[key]||'';if(sensitive.has(key))i.type='password';d.append(l,i);return d;}));document.getElementById('status').textContent=' 已连接';await audit()}catch(e){document.getElementById('status').textContent=' 连接失败: '+e.message}}
async function save(){try{const values={};for(const key of Object.keys(names)){let v=document.getElementById('field-'+key).value;if(v!==loaded[key])values[key]=v}await request('/api/v1/settings',{method:'PUT',body:JSON.stringify({values})});document.getElementById('saved').textContent=' 保存成功';await load()}catch(e){document.getElementById('saved').textContent=' 保存失败: '+e.message}}
async function audit(){const rows=await request('/api/v1/audit');document.getElementById('audit').textContent=rows.map(x=>x.time+'  '+x.action+'  '+x.key).join('\n')}
</script></body></html>
