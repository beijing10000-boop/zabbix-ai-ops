<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F2F2F7">
<title>Zabbix AI Ops · 智能运维控制台</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<div id="login-view" class="login-shell">
 <div class="card login-card">
  <div class="app-icon" aria-hidden="true">Z</div>
  <h1>Zabbix AI Ops</h1>
  <p>面向运维团队的智能告警与诊断平台</p>
  <button id="login-action" type="button" class="btn">使用飞书登录</button>
 </div>
</div>
<div id="app-shell" class="app-shell" hidden>
 <aside class="sidebar" aria-label="主导航">
  <div class="brand"><div class="app-icon" aria-hidden="true">Z</div><div><strong>Zabbix AI Ops</strong><small>Intelligent Operations</small></div></div>
  <div id="desktop-navigation"></div>
  <div class="sidebar-bottom"><span id="backend-version" class="caption">版本加载中…</span></div>
 </aside>
 <main class="workspace" id="workspace">
  <header class="topbar">
   <div><h1 id="page-title">总览仪表盘</h1><p id="page-subtitle">告警态势 · 服务运行状态</p></div>
   <div class="account"><span class="status-dot green">已登录</span><span id="user-avatar" class="avatar">A</span><span id="user-name" class="name">管理员</span><button id="signout" type="button" class="btn text">退出</button></div>
  </header>
  <div id="page-content" class="page active"></div>
  <div id="save-actions" class="sticky-actions" hidden><span class="footnote">有未保存的设置</span><button id="save-reset" type="button" class="btn secondary">还原</button><button id="save-submit" type="button" class="btn">保存</button></div>
 </main>
 <div id="frosted-title" class="frosted-title" aria-hidden="true"></div>
 <nav id="mobile-navigation" class="mobile-tabbar" aria-label="移动导航"></nav>
</div>
</body>
</html>
