<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>首次初始化 · Zabbix AI Ops</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#17273b;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:30px 16px}
main{max-width:570px;margin:auto;background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:30px;box-shadow:0 8px 24px #12264b10}
h1{font-size:23px;margin:0 0 6px}p{color:#596b80}label{display:block;margin-top:15px;font-weight:600}
input,select{display:block;width:100%;padding:12px;border-radius:8px;border:1px solid #b8c8d9;font:inherit;margin-top:5px}
button{width:100%;margin-top:22px;padding:13px;background:#2869ce;border:0;border-radius:8px;color:white;font-weight:700;cursor:pointer}
small{display:block;color:#63748b;margin-top:5px}#status{margin-top:16px;white-space:pre-wrap}
</style></head><body><main>
<h1>首次初始化</h1><p>仅配置 Web 登录所需的项目，完成后此入口自动关闭。其他业务设置继续在管理后台完成。</p>
<form id="setup">
<label>初始化凭据<input type="password" name="bootstrap_token" autocomplete="off" required></label>
<small>服务器部署时设置的 ADMIN_API_TOKEN。只用于首次初始化，不会存入业务配置。</small>
<label>访问协议<select name="web_protocol"><option value="http">HTTP（仅内部测试）</option><option value="https">HTTPS（推荐）</option></select></label>
<label>Web 外部访问主机<input name="web_public_host" placeholder="172.20.200.93:8088" required></label>
<label>飞书应用 App ID<input name="lark_app_id" placeholder="cli_xxxxxxxxxxxx" required></label>
<label>飞书应用 App Secret<input type="password" name="lark_app_secret" autocomplete="off" required></label>
<label>管理员 Open ID<input name="feishu_admin_open_ids" placeholder="ou_xxxx,ou_yyyy" required></label>
<small>多个管理员以英文逗号分隔；请包含自己当前飞书账户的 Open ID。</small>
<button type="submit">保存并完成初始化</button></form>
<div id="status" role="status"></div>
<p><a href="/">返回登录页</a></p>
</main>
<script>
const status=document.getElementById('status'),form=document.getElementById('setup');
fetch('/api/v1/setup/status',{cache:'no-store'}).then(r=>r.json()).then(v=>{
 if(!v.setup_required){form.hidden=true;status.textContent='初始化已完成，请返回首页登录。';}
}).catch(()=>{status.textContent='无法获取初始化状态，请检查服务。'});
form.addEventListener('submit',async e=>{
 e.preventDefault();status.textContent='正在验证并保存…';
 const payload=Object.fromEntries(new FormData(form).entries());
 try{
  const resp=await fetch('/api/v1/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await resp.json();
  if(!resp.ok)throw Error(typeof data.detail==='string'?data.detail:'初始化失败');
  form.hidden=true;
  status.textContent='初始化成功。请确认飞书开放平台的回调地址为 '+payload.web_protocol+'://'+payload.web_public_host+'/api/v1/auth/callback ，再返回首页使用飞书登录。';
 }catch(err){status.textContent=err.message;}
});
</script></body></html>
